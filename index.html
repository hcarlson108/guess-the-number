<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weatha</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Welcome to Hayden's Guess The Number Game</h1>
    <p>Enter a number from 1 - 100</p>
    <input
      type="number"
      id="guessInput"
      min="1"
      max="100"
      placeholder="Your guess!"
    />
    <button id="guessBtn">Guess!</button>

    <div id="message"></div>
    <script src="app.js"></script>
  </body>
</html>
